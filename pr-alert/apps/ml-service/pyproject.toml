[project]
name = "pr-alert-ml-service"
version = "0.1.0"
description = "ML Inference Service for PR-Alert"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.1.0",
    "onnxruntime>=1.18.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "joblib>=1.4.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"